openapi: 3.1.0

info:
  version: 1.0.0
  title: Stage Events
  description: This API provides real-time stage events streaming capabilities.
  contact:
    name: Terradue
    email: info@terradue.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt

servers:
- description: Webhook exposed internal service
  url: http://cloud-events-webhook-eventsource-svc:12000

security:
- BearerToken: []

paths:
  /cloud-events:
    post:
      summary: Send CloudEvent.
      description: |
        Sends a structured-mode CloudEvent.

        For more information, see [CloudEvents - Version 1.0.2](https://github.com/cloudevents/spec/blob/v1.0.2/cloudevents/spec.md).
      operationId: sendCloudEvent
      parameters:
      - $ref: '#/components/parameters/X-Kafka-Topic'
      requestBody:
        description: A structured-mode CloudEvent.
        required: true
        content:
          application/cloudevents+json:
            schema:
              oneOf: 
              - $ref: '#/components/schemas/CalendarCloudEvent'
              - $ref: '#/components/schemas/SubmittedCloudEvent'
              - $ref: '#/components/schemas/DismissedCloudEvent'
              - $ref: '#/components/schemas/PreparedCloudEvent'
              - $ref: '#/components/schemas/CompletedCloudEvent'
              - $ref: '#/components/schemas/FailedCloudEvent'
              - $ref: '#/components/schemas/PipedCloudEvent'
              - $ref: '#/components/schemas/StagedCloudEvent'
              - $ref: '#/components/schemas/OrderedCloudEvent'
            examples:
              Calendar:
                $ref: '#/components/examples/Calendar'
              Submitted:
                $ref: '#/components/examples/Submitted'
              Prepared:
                $ref: '#/components/examples/Prepared'
              Dismissed:
                $ref: '#/components/examples/Dismissed'
              Completed:
                $ref: '#/components/examples/Completed'
              Failed:
                $ref: '#/components/examples/Failed'
              Staged:
                $ref: '#/components/examples/Staged'
              Piped:
                $ref: '#/components/examples/Piped'
              Ordered:
                $ref: '#/components/examples/Ordered'
      responses:
        '200':
          $ref: '#/components/responses/WebhookOk'
        '400':
          $ref: 'https://eoap.github.io/problems-registry/openapi.yaml#/components/responses/BadRequest'

components:
  securitySchemes:
    BearerToken:
      description: Bearer Token authentication
      type: apiKey
      name: Authorization
      in: header

  parameters:
    X-Kafka-Topic:
      name: X-Kafka-Topic
      in: header
      schema:
        type: string
        pattern: ^[^.]+\.[^.]+\.(\d+[hmsd]\.calendar|prepared|submitted|completed|failed|piped|staged|dismissed|ordered)$
      required: true
      description: |
        The named resource that serves as a feed for messages.

        Pattern is `{{workflow.namespace}}.{{workflow.uid}}.(\d+[hmsd]\.calendar|prepared|completed|failed|piped|staged|ordered)`, where:

        | Topic                                                         | Semantic                                                                                            |
        |---------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|
        | `{{workflow.namespace}}.{{workflow.uid}}.\d+[hmsd].calendar`  | CWL and input parameters are wrapped w/ stage-in/out steps                                          |
        | `{{workflow.namespace}}.{{workflow.uid}}.prepared`            | CWL and input parameters are wrapped w/ stage-in/out steps                                          |
        | `{{workflow.namespace}}.{{workflow.uid}}.completed`           | Workflow completed its life cycle and CommandLineTools/Calrissian stderr/out logs are collected     |
        | `{{workflow.namespace}}.{{workflow.uid}}.failed`              | Workflow failed during its life cycle and CommandLineTools/Calrissian stderr/out logs are collected |
        | `{{workflow.namespace}}.{{workflow.uid}}.piped`               | Feature Collection is generated                                                                     |
        | `{{workflow.namespace}}.{{workflow.uid}}.staged`              | Results are posted in Catalog via `stac-postman`                                                    |
        | `{{workflow.namespace}}.{{workflow.uid}}.ordered`             | A STAC Item transitioned from `order:status=orderable` to `order:status=ordered`;                   |

  schemas:
    CalendarCloudEvent:
      type: object
      title: CalendarCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required: 
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'calendar-event'
            default: 'calendar-event'
          data:
            $ref: '#/components/schemas/CalendarData'
            description: The event payload.

    SubmittedCloudEvent:
      type: object
      title: SubmittedCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required: 
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'submitted'
            default: 'submitted'
          data:
            $ref: '#/components/schemas/SubmittedData'
            description: The event payload.
    
    DismissedCloudEvent:
      type: object
      title: DismissedCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required: 
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'dismissed'
            default: 'dismissed'
          data:
            $ref: '#/components/schemas/DismissedData'
            description: The event payload.

    PreparedCloudEvent:
      type: object
      title: PreparedCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required: 
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'prepared'
            default: 'prepared'
          data:
            $ref: '#/components/schemas/PreparedData'
            description: The event payload.

    CompletedCloudEvent:
      type: object
      title: CompletedCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required: 
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'completed'
            default: 'completed'
          data:
            $ref: '#/components/schemas/CompletedData'
            description: The event payload.

    FailedCloudEvent:
      type: object
      title: FailedCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required: 
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'failed'
            default: 'failed'
          data:
            $ref: '#/components/schemas/FailedData'
            description: The event payload.

    StagedCloudEvent:
      type: object
      title: StagedCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required: 
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'staged'
            default: 'staged'
          data:
            $ref: '#/components/schemas/StagedData'
            description: The event payload.

    PipedCloudEvent:
      type: object
      title: PipedCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required: 
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'piped'
            default: 'piped'
          data:
            $ref: '#/components/schemas/PipedData'
            description: The event payload.

    OrderedCloudEvent:
      type: object
      title: OrderedCloudEvent
      allOf: 
      -  $ref: '#/components/schemas/BaseCloudEvent'
      - type: object
        required:
        - type
        - data
        properties:
          type:
            type: string
            description: |
              Contains a value describing the type of event related to the originating occurrence.
            const: 'ordered'
            default: 'ordered'
          data:
            $ref: '#/components/schemas/OrderedData'
            description: The event payload.

    BaseCloudEvent:
      title: CloudEvent
      type: object
      required:
        - specversion
        - datacontenttype
        - source
        - subject
        - partitionkey
      properties:
        specversion:
          type: string
          description: The version of the CloudEvents specification which the event uses.
          const: "1.0"
        datacontenttype:
          type: string
          description: Content type of the data value. Must adhere to RFC 2046 format.
          const: "application/json"
        source:
          type: string
          pattern: ^[^:]+:[^:]+:[^:]+$
          description: |
            Identifies the context in which an event happened.

            Pattern is `{workflow.namespace}}:{{workflow.annotations.eoap.ogc.org/id}}:{{steps.name}}`.
        subject:
          type: string
          pattern: ^[^:]+:[^:]+:[^:]+$
          description: |
            The subject of the event in the context of the event producer (identified by `source`).

            Pattern is `{{workflow.namespace}}:{{workflow.uid}}:{{workflow.name}}`.
        partitionkey:
          type: string
          description: |
            A partition key for the event, typically for the purposes of defining a causal relationship/grouping between multiple events.

            _Implementors note_: set it equals to the subject by default.

    BaseData:
      title: BaseData
      type: object
      required:
      - namespace
      properties:
        namespace:
          type: string
          description: The declarative region that provides a scope to the processes.
        owner_id:
          type:
          - string
          - "null"
          description: The unique Owner identifier to trace the member of the subscription that owns workflow.
        properties:
          type: object
          additionalProperties: true
          description: The properties that describe the process.
        priority:
          type: string
          description: The right to proceed before other executions.

    CalendarData:
      title: CalendarData
      allOf:
      - $ref: '#/components/schemas/BaseData'
      - type: object
        required:
        - event_time
        - start_time
        - end_time
        properties:
          event_time:
            type: string
            format: date-time
            description: The Argo Events event time, in ISO string format.
          start_time:
            type: string
            format: date-time
            description: The Start Time event, in ISO string format.
          end_time:
            type: string
            format: date-time
            description: The End Time event, in ISO string format.

    SubmittedData:
      title: SubmittedData
      allOf:
      - $ref: '#/components/schemas/BaseData'
      - type: object
        properties:
          time:
            type: string
            format: date-time
            description: The Argo Workflow submission time, in ISO string format.

    DismissedStatus:
      type: string
      enum:
      - 'Unknown'
      - 'Pending'
      - 'Running'
      - 'Succeeded'
      - 'Failed'
      - 'Error'

    DismissedData:
      title: DismissedData
      allOf:
      - $ref: '#/components/schemas/BaseData'
      - type: object
        required:
        - status
        properties:
          status:
            $ref: '#/components/schemas/DismissedStatus'
          time:
            type: string
            format: date-time
            description: The Argo Workflow dismission time, in ISO string format.

    PreparedData:
      title: PreparedData
      allOf:
      - $ref: '#/components/schemas/BaseData'
      - type: object
        required:
        - job_id
        - process_id
        - inputs
        properties:
          process_id:
            type: string
            description: The unique Process identifier inside the namespace.
          process_version:
            type: string
            pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
            description: |
              The Process version, according to the [Semantic Versioning 2.0.0](https://semver.org/) scheme.
          job_id:
            type: string
            description: The unique Job identifier inside the namespace.
          inputs:
            type: object
            additionalProperties: true
            description: The dictionary that describes inputs identifiers with related values.

    Usage:
      type: object
      description: Report of a process total used resources.
      properties:
        start_time:
          type: string
          format: date-time
          description: |
            The execution start time, in the date-time notation as defined by [RFC 3339, section 5.6](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6).
          example: '2025-03-11T16:20:36Z'
        finish_time:
          type: string
          format: date-time
          description: |
            The execution finish time, in the date-time notation as defined by [RFC 3339, section 5.6](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6).
          example: '2025-03-11T16:23:17Z'
        elapsed_hours:
          type: number
          format: double
          description: The execution elapsed hour(s).
          example: 0.04472222222222222
        elapsed_seconds:
          type: integer
          format: int32
          description: The execution elapsed second(s).
          example: 161
        cores_allowed:
          type: number
          format: double
          description: The maximum number of Central Processing Unit cores to use.
          example: 8
        max_parallel_cpus:
          type: integer
          format: int32
          description: The maximum number of used Central Processing Unit cores.
          example: 7
        total_cpu_hours:
          type: number
          format: double
          description: The number of used Central Processing Unit cores per hour.
          example: 0.21305555555555555
        ram_mb_allowed:
          type: number
          format: double
          description: The maximum amount of RAM to use, in MegaBytes.
          example: 4000
        total_ram_megabyte_hours:
          type: number
          format: double
          description: The total size of the RAM used per hour for the execution, in MegaBytes.
          example: 114.3833304177778
        max_parallel_ram_megabytes:
          type: number
          format: double
          example: 3758.0963839999995
        total_disk_megabytes:
          type: number
          format: double
          description: The total size of the Disk used per hour for the execution, in MegaBytes.
          example: 2490.712061999999
        max_parallel_tasks:
          type: integer
          format: int32
          description: The maximum number of parallel executing tasks.
        total_tasks:
          type: integer
          format: int32
          description: The total number of executed tasks.
          example: 25
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildUsage'
          description: The executed tasks.
          example:
          - cpus: 1
            ram_megabytes: 536.870912
            disk_megabytes: 99.962848
            exit_code: 0
            name: node_crop_6
            start_time: '2025-03-11T16:20:37Z'
            finish_time: '2025-03-11T16:21:25Z'
            elapsed_hours: 0.013333333333333334
            elapsed_seconds: 48
            ram_megabyte_hours: 7.158278826666667
            cpu_hours: 0.013333333333333334

    CompletedData:
      title: CompletedData
      allOf:
      - $ref: '#/components/schemas/BaseData'
      - type: object
        required:
        - job_id
        - process_id
        - usage
        - outputs
        properties:
          process_id:
            type: string
            description: The unique Process identifier inside the namespace.
          process_version:
            type: string
            pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
            description: |
              The Process version, according to the [Semantic Versioning 2.0.0](https://semver.org/) scheme.
          job_id:
            type: string
            description: The unique Job identifier inside the namespace.
          usage:
            $ref: '#/components/schemas/Usage'
          outputs:
            type: object
            additionalProperties: true
            description: The dictionary that describes outputs identifiers with related values.

    ErrorDetail:
      type: object
      description: An object to provide explicit details on a problem towards an API consumer.
      required:
      - detail
      properties:
        detail:
          type: string
          description: A granular description on the specific error related to a body property, query parameter, path parameters, and/or header.
          maxLength: 4096
        pointer:
          type: string
          description: A JSON Pointer to a specific request body property that is the source of error.
          maxLength: 1024
        parameter:
          type: string
          description: The name of the query or path parameter that is the source of error.
          maxLength: 1024
        header:
          type: string
          description: The name of the header that is the source of error.
          maxLength: 1024
        code:
          type: string
          description: A string containing additional provider specific codes to identify the error context.
          maxLength: 50

    Exception:
      title: Exception Schema
      description: |-
        The `exception` object provides detailed information about an errors that occurred during an API call execution. This problem object conforms to the [RFC9457](https://www.rfc-editor.org/info/rfc9457) (formerly [RFC7807](https://tools.ietf.org/html/rfc7807)).
        The object is extended with the following properties: - `code` - a string identifier to aid the provider team better understand the error - `errors` - and array of errors providing contextual information on the root cause of the problem
        The `exception` referenced by this domain utilize a custom Terradue Problems Registry.
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          format: uri
          pattern: https://mate.terradue.com/.+
          maxLength: 1024
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          minimum: 100
          maximum: 599
        title:
          type: string
          description: A short, human-readable summary of the problem type. It should not change from occurrence to occurrence of the problem, except for purposes of localization.
          maxLength: 1024
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          maxLength: 4096
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          maxLength: 1024
        code:
          type: string
          description: An API specific error code aiding the provider team understand the error based on their own potential taxonomy or registry.
          maxLength: 50
        errors:
          type: array
          description: An array of error details to accompany a problem details response.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ErrorDetail'

    FailedData:
      title: FailedData
      allOf:
      - $ref: '#/components/schemas/BaseData'
      - type: object
        required:
        - job_id
        - process_id
        - usage
        properties:
          process_id:
            type: string
            description: The unique Process identifier inside the namespace.
          process_version:
            type: string
            pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
            description: |
              The Process version, according to the [Semantic Versioning 2.0.0](https://semver.org/) scheme.
          job_id:
            type: string
            description: The unique Job identifier inside the namespace.
          exception:
            $ref: '#/components/schemas/Exception'
          usage:
            $ref: '#/components/schemas/Usage'

    BBox:
      type: array
      minItems: 4
      items:
        type: number

    Point:
      title: GeoJSON Point
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          const: Point
        coordinates:
          type: array
          minItems: 2
          items:
            type: number
        bbox:
          $ref: '#/components/schemas/BBox'

    LineString:
      title: GeoJSON LineString
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            items:
              type: number
        bbox:
          $ref: '#/components/schemas/BBox'

    Polygon:
      title: GeoJSON Polygon
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              items:
                type: number
        bbox:
          $ref: '#/components/schemas/BBox'

    MultiPoint:
      title: GeoJSON MultiPoint
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          const: MultiPoint
        coordinates:
          type: array
          items:
            type: array
            minItems: 2
            items:
              type: number
        bbox:
          $ref: '#/components/schemas/BBox'

    MultiLineString:
      title: GeoJSON MultiLineString
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          const: MultiLineString
        coordinates:
          type: array
          items:
            type: array
            minItems: 2
            items:
              type: array
              minItems: 2
              items:
                type: number
        bbox:
          $ref: '#/components/schemas/BBox'

    MultiPolygon:
      title: GeoJSON MultiPolygon
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          const: MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              minItems: 4
              items:
                type: array
                minItems: 2
                items:
                  type: number
        bbox:
          $ref: '#/components/schemas/BBox'

    GeometryCollection:
      title: GeoJSON GeometryCollection
      type: object
      required:
      - type
      - geometries
      properties:
        type:
          type: string
          const: GeometryCollection
        geometries:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/LineString'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPoint'
            - $ref: '#/components/schemas/MultiLineString'
            - $ref: '#/components/schemas/MultiPolygon'
        bbox:
          $ref: '#/components/schemas/BBox'

    Feature:
      title: GeoJSON Feature
      type: object
      required:
      - type
      - properties
      - geometry
      properties:
        type:
          type: string
          const: Feature
        id:
          oneOf:
          - type: number
          - type: string
        properties:
          oneOf: 
          - type: object
          - type: "null"
        geometry:
          oneOf:
          - type: "null"
          - $ref: '#/components/schemas/Point'
          - $ref: '#/components/schemas/LineString'
          - $ref: '#/components/schemas/Polygon'
          - $ref: '#/components/schemas/MultiPoint'
          - $ref: '#/components/schemas/MultiLineString'
          - $ref: '#/components/schemas/MultiPolygon'
          - $ref: '#/components/schemas/GeometryCollection'
        bbox:
          $ref: '#/components/schemas/BBox'
      
    FeatureCollection:
      # $schema: http://json-schema.org/draft-07/schema#
      # $id: https://geojson.org/schema/FeatureCollection.json
      title: GeoJSON FeatureCollection
      type: object
      required:
      - type
      - features
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            anyOf: 
            - $ref: '#/components/schemas/Feature'
            - type: object
        bbox:
          type: array
          minItems: 4
          items:
            type: number

    StagedData:
      title: StagedData
      allOf:
      - $ref: '#/components/schemas/BaseData'
      - type: object
        required:
        - job_id
        - process_id
        - outputs
        properties:
          process_id:
            type: string
            description: The unique Process identifier inside the namespace.
          process_version:
            type: string
