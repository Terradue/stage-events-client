site_name: Stage Events Client
site_description: Python and CLI documentation for the Stage Events client
site_author: Terradue
site_url: https://terradue.github.io/stage-events-client/
repo_url: https://github.com/Terradue/stage-events-client/
repo_name: Terradue/stage-events-client

theme:
  name: readthedocs

plugins:
- search

markdown_extensions:
- tables
- fenced_code
- admonition

