- Tutorials:
  - Overview: tutorials/index.md
  - Send your first event locally: tutorials/first-event.md
- How-to guides:
  - Overview: how-to/index.md
  - Send events from the command line: how-to/send-from-cli.md
  - Use the Python client: how-to/use-python.md
  - Diagnose failed requests: how-to/handle-errors.md
  - Develop and regenerate the client: how-to/development.md
- Reference:
  - Overview: reference/index.md
  - CLI: cli.md
  - Python API: python-api.md
  - Event models: reference/events.md
  - OpenAPI: c4/class/schemas/openapi.html
- Explanation:
  - Overview: explanation/index.md
  - Events and client architecture: explanation/architecture.md

